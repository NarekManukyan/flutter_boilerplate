name: flutter_boilerplate
description: A boilerplate project created in flutter using MobX.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.8.0-0 <4.0.0'

workspace:
  - packages/api
  - packages/design_system

dependencies:
  # Core Flutter dependencies
  flutter:
    sdk: flutter

  
  # local packages
  api:
    path: packages/api
  design_system:
    path: packages/design_system

  # State management
  # MobX and Provider for state management
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0
  provider: ^6.1.5+1

  # Routing
  # AutoRoute for navigation
  auto_route: ^11.1.0

  # Networking
  # Dio for HTTP requests, connectivity_plus for network status
  connectivity_plus: ^7.1.1
  dio: ^5.9.2

  # Localization
  # easy_localization for i18n
  easy_localization: ^3.0.8

  # Dependency injection
  # get_it and injectable for DI
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Code generation
  # For code generation and serialization
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # UI & design
  # UI helpers and widgets
  flutter_gen: ^5.14.0
  gap: ^3.0.1
  overlay_support: ^2.1.0
  extended_image: ^10.0.1
  skeletonizer: ^2.1.3

  # Utilities
  # Useful utilities for app development
  rxdart: ^0.28.0
  faker: ^2.2.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  uuid: ^4.5.3
  open_settings_plus: ^0.4.2

  # App update
  # For checking app updates
  upgrader: ^13.7.0

  # Authentication & social login
  # Apple and Google sign-in

  # Analytics & error reporting
  # Sentry for error tracking
  sentry_flutter: ^9.18.0
  sentry_logging: ^9.18.0

  flutter_hooks: ^0.21.2
dev_dependencies:
  # Testing — ADR-0015
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

  # Code generation tools
  build_runner: ^2.14.0
  freezed: ^3.2.5
  auto_route_generator: ^10.5.0
  injectable_generator: ^3.0.2
  json_serializable: ^6.13.1
  mobx_codegen: ^2.7.7
  # Testing
  flutter_driver:
    sdk: flutter
  # Monorepo management
  melos: ^7.5.1

# Flutter assets and material design
flutter:
  uses-material-design: true
  assets:
    - assets/translations/

melos:
  name: flutter_boilerplate
  repository: https://github.com/NarekManukyan/flutter_boilerplate

  scripts:
    # Development Workflow
    dev:
      description: Complete development setup (deps, generate)
      run: melos run deps && melos run generate

    deps:
      description: Get dependencies for all packages
      run: melos exec -c 1 -- "dart pub get"

    deps:check:
      description: List outdated dependencies for the app and both packages (informational, never fails)
      run: |
        (flutter pub outdated || true) && \
        (melos exec -c 1 -- "flutter pub outdated" || true)

    generate:
      description: Generate code for all packages
      run: melos run build

    build:
      description: Codegen for everything, in dependency order (ADR-0014)
      # `translations` must run here, not only on demand: lib/gen/*.g.dart is
      # gitignored, so a clean checkout has no LocaleKeys and will not analyze
      # until easy_localization has generated them.
      # Order matters: the app's generators resolve types from both packages,
      # so their generated code has to exist before the app's build runs.
      run: |
        melos run translations && \
        melos run build:api && \
        melos run build:design_system && \
        melos run build:app

    build:api:
      description: Codegen for packages/api only
      run: melos exec -c 1 --scope=api -- "dart run build_runner build -d"

    build:design_system:
      description: Codegen for packages/design_system only
      run: melos exec -c 1 --scope=design_system -- "dart run build_runner build -d"

    build:app:
      description: Codegen for the app (lib/) only
      run: dart run build_runner build -d

    watch:
      description: Codegen for the app (lib/) in watch mode — rebuilds on every save
      run: dart run build_runner watch -d

    clean:
      description: Clean codegen output for the app and both packages
      run: |
        dart run build_runner clean && \
        melos exec -c 1 -- "dart run build_runner clean"

    clean:all:
      description: Deep clean — build_runner caches (app + packages), lib/gen/*.g.dart, flutter clean
      # build_runner runs before `flutter clean`, which deletes the .dart_tool/
      # that build_runner needs.
      run: |
        dart run build_runner clean && \
        melos exec -c 1 -- "dart run build_runner clean" && \
        rm -f lib/gen/*.g.dart && \
        flutter clean

    rebuild:
      description: clean:all, then bootstrap (deps + full codegen) from scratch
      run: |
        melos run clean:all && \
        melos run bootstrap

    # Code Quality
    # NOTE: `melos exec` only reaches packages/api and packages/design_system —
    # the root app is not a melos package (see `melos list`). Every script below
    # therefore runs the root explicitly first, then the workspace packages.
    analyze:
      description: Analyze the app and both packages
      run: |
        flutter analyze lib test && \
        melos exec -c 1 -- "dart analyze ."

    # Testing — ADR-0015. Three tiers: unit + widget here, E2E under `maestro`.
    test:
      description: Run unit + widget tests (app + any package with a test/ dir)
      run: |
        flutter test && \
        melos exec -c 1 --dir-exists=test -- "dart test"

    test:coverage:
      description: Run the app's tests with lcov coverage output
      run: flutter test --coverage

    # tool/run_maestro.sh reads APP_ID (default com.example.flutterBoilerplate),
    # DEVICE and OUT_DIR from the environment and passes extra arguments on to
    # `maestro test`.
    maestro:
      description: Run every Maestro E2E flow — needs a booted device with the app installed
      run: ./tool/run_maestro.sh

    maestro:happy:
      description: Run only the happy-path Maestro flows (the PR gate)
      run: ./tool/run_maestro.sh --include-tags happy --exclude-tags quarantine

    format:
      description: Format the app and both packages
      run: dart format lib test packages tool

    format:check:
      description: Fail if anything is unformatted (CI)
      run: dart format --output none --set-exit-if-changed lib test packages

    lint:
      description: Apply mechanical lint fixes
      run: |
        dart fix --apply && \
        melos exec -c 1 -- "dart fix --apply"

    # verify and verify:quick only check, they never modify files. To auto-fix
    # first, run `melos run lint` and `melos run format`.
    verify:
      description: Everything CI checks except E2E, read-only — analyze, format check, tests, agent-file drift
      run: |
        melos run analyze && \
        melos run format:check && \
        melos run test && \
        ./tool/sync_agents.sh --check

    verify:quick:
      description: Fast read-only check — analyze + format check, no tests
      run: |
        melos run analyze && \
        melos run format:check

    sync-agents:
      description: Regenerate CLAUDE.md / GEMINI.md / copilot-instructions / cursor rule from AGENTS.md
      run: ./tool/sync_agents.sh

    hooks:install:
      description: Use the repo's git hooks — pre-commit formats, fixes and analyzes the staged Dart files
      run: git config core.hooksPath tool/git-hooks

    # Asset Generation
    assets:
      description: Generate assets and translations
      run: melos exec --scope design_system -- "dart run build_runner build -d" && melos run translations

    translations:
      description: Generate translation keys
      # easy_localization's generator does not emit dart-format-clean output, so
      # format it here. Otherwise `format:check` fails on a file nobody edited,
      # on any machine that regenerated it.
      run: |
        dart run easy_localization:generate -f keys -O lib/gen -o locale_keys.g.dart -S assets/translations -s en-US.json -u true && \
        dart format lib/gen/locale_keys.g.dart

    # Workspace Management
    bootstrap:
      description: Bootstrap the workspace
      run: melos run deps && melos run generate

    # Deployment
    deploy-dev:
      description: Deploy to development environment (stops on error)
      run: |
        cd ios && \
        pod install --repo-update && \
        fastlane dev
