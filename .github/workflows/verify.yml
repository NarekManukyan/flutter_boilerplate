name: Verify

on:
  pull_request:
  push:
    branches: [master, main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true


# Read-only token: these jobs check code, they never write to the repo.
permissions:
  contents: read

jobs:
  # The same checks as `melos run verify`, split into steps so a failure is
  # easy to spot. Every step only checks: nothing here modifies files (no
  # `dart fix --apply`, no `dart format` without --set-exit-if-changed).
  verify:
    name: Analyze · Format · Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLUTTER_DISABLE_ANALYTICS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install melos
        run: dart pub global activate melos

      - name: Bootstrap
        run: |
          flutter pub get
          melos run deps

      - name: Codegen
        run: melos run build

      # AGENTS.md is the single source; CLAUDE.md, GEMINI.md,
      # copilot-instructions.md and the cursor rule are generated from it
      # (ADR-0017). A hand edit to a generated copy fails here rather than
      # being silently overwritten later.
      - name: Agent instruction files are in sync
        run: ./tool/sync_agents.sh --check

      - name: Format check
        run: melos run format:check

      - name: Analyze
        run: melos run analyze

      # Unit + widget tiers of ADR-0015. The E2E tier runs in maestro.yml.
      # `melos run test` minus coverage: the app with lcov output, then any
      # workspace package that has a test/ directory.
      - name: Test
        run: |
          flutter test --coverage
          melos exec -c 1 --dir-exists=test -- "dart test"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  # Proves the app still compiles for a device. Analyze and tests do not catch
  # native build breakage: plugin minSdk or Gradle/Kotlin requirements,
  # manifest merges, codegen that analyzes but does not compile.
  build-smoke:
    name: Build smoke (Android debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_DISABLE_ANALYTICS: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install melos
        run: dart pub global activate melos

      # The boilerplate does not commit android/ (each app needs its own
      # application id and signing), so generate the platform shell first.
      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.example .

      - name: Bootstrap
        run: |
          flutter pub get
          melos run deps

      - name: Codegen
        run: melos run build

      - name: Build debug APK
        run: flutter build apk --debug -t lib/main_dev.dart
