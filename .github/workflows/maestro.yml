name: Maestro E2E

on:
  pull_request:
  schedule:
    # Full suite nightly; PRs only run the happy tag (see the tags step below).
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Maestro tags to include (comma-separated)'
        required: false
        default: ''

concurrency:
  group: maestro-${{ github.ref }}
  cancel-in-progress: true


# Read-only token: these jobs check code, they never write to the repo.
permissions:
  contents: read

jobs:
  e2e:
    name: E2E on iOS Simulator
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # This boilerplate deliberately does not commit ios/ or android/ — every
      # app generated from it runs `flutter create` with its own org and
      # signing identity (see README, "No committed ios/ or android/"). So this
      # job always skips here, and runs unchanged in a generated app where
      # ios/ is committed. The flows themselves are verified locally with
      # `melos run maestro`.
      - name: Is there an iOS project to build?
        id: ios
        run: |
          if [ -z "$(git ls-files ios | head -1)" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=E2E skipped by design::No committed ios/ — this repo is a boilerplate and each app generates its own platform folders. Run the flows locally with 'melos run maestro'. This job runs automatically in an app that commits ios/."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.ios.outputs.present == 'true'
        with:
          channel: stable
          cache: true

      - name: Install melos
        if: steps.ios.outputs.present == 'true'
        run: dart pub global activate melos

      - name: Bootstrap
        if: steps.ios.outputs.present == 'true'
        run: |
          flutter pub get
          melos run deps
          melos run build

      # PRs run the happy tag only — the full trio takes too long to gate every
      # push. Nightly and manual runs execute everything (ADR-0015). Quarantined
      # flows are excluded by .maestro/config.yaml, not here.
      - name: Choose tags
        if: steps.ios.outputs.present == 'true'
        id: tags
        env:
          # Passed through env, never interpolated into the script.
          INPUT_TAGS: ${{ github.event.inputs.tags }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_TAGS" ]; then
            echo "args=--include-tags $INPUT_TAGS" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            echo "args=--include-tags happy" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Boot simulator
        if: steps.ios.outputs.present == 'true'
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(dev['udid'] for k,v in d.items() if 'iOS' in k for dev in v if 'iPhone' in dev['name']))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build dev app for simulator
        if: steps.ios.outputs.present == 'true'
        run: flutter build ios --simulator --debug -t lib/main_dev.dart

      - name: Install app
        if: steps.ios.outputs.present == 'true'
        run: xcrun simctl install "$SIM_UDID" build/ios/iphonesimulator/Runner.app

      - name: Install Maestro
        if: steps.ios.outputs.present == 'true'
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Every flow header is `appId: ${APP_ID}`. Read it from the app we just
      # built, so a generated app with its own --org needs no edit here.
      - name: Read bundle id
        if: steps.ios.outputs.present == 'true'
        run: |
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/ios/iphonesimulator/Runner.app/Info.plist)
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"

      # tool/run_maestro.sh passes -e APP_ID, runs the .maestro workspace root and
      # writes .maestro/output/{report.xml,debug/,artifacts/}. Its exit code is
      # Maestro's.
      - name: Run flows
        if: steps.ios.outputs.present == 'true'
        env:
          DEVICE: ${{ env.SIM_UDID }}
          TAG_ARGS: ${{ steps.tags.outputs.args }}
        # TAG_ARGS is unquoted on purpose: "--include-tags happy" is two words.
        run: ./tool/run_maestro.sh $TAG_ARGS

      - name: Upload report
        if: always() && steps.ios.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: maestro-output
          path: .maestro/output
          # Maestro nests debug output under a hidden .maestro/tests/<timestamp>/,
          # which upload-artifact skips by default.
          include-hidden-files: true
          if-no-files-found: warn
