name: GLM

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  glm:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@glm')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@glm')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@glm')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@glm') || contains(github.event.issue.title, '@glm')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for GLM to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup SSH for submodules
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MONE_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Init and update submodules
        run: |
          git submodule sync
          git submodule update --init --recursive


      - name: Run GLM
        id: glm
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: "https://api.z.ai/api/anthropic"
          ANTHROPIC_AUTH_TOKEN: "${{ secrets.GLM_API_KEY }}"
          ANTHROPIC_SMALL_FAST_MODEL: "GLM-4.5-Air"
          ANTHROPIC_MODEL: "GLM-4.5"
        with:
          claude_code_oauth_token: ${{ secrets.GLM_API_KEY }}

          # Optional: Customize the trigger phrase (default: @claude)
          trigger_phrase: "@glm"

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
            --mcp-config .github/workflows/mcp.json
            --append-system-prompt "You are a senior software engineer with 10+ years of experience. Read `.cursor/rules/*.mdc` files and run `git ls-files` to understand the context of the project."

        # Optional: Use sticky comments to make Claude reuse the same comment on subsequent pushes to the same PR


          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"


          # Optional: Advanced settings configuration
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "https://api.z.ai/api/anthropic",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.GLM_API_KEY }}",
                "ANTHROPIC_SMALL_FAST_MODEL": "GLM-4.5-Air",
                "ANTHROPIC_MODEL": "GLM-4.5"
              }
            }
